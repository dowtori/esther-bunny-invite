<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>시리아이 · 스킨케어 캠페인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a1a;
  --ink70:rgba(26,26,26,.7);
  --ink50:rgba(26,26,26,.5);
  --ink30:rgba(26,26,26,.3);
  --ink15:rgba(26,26,26,.15);
  --ink08:rgba(26,26,26,.08);
  --bg:#f5f5f3;
  --white:#fff;
  --green:#2d8a4e;
  --green-bg:rgba(45,138,78,.08);
  --yellow:#a07d1e;
  --yellow-bg:rgba(160,125,30,.08);
  --gray:#888;
  --gray-bg:rgba(0,0,0,.04);
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;
  font-weight:400;font-size:14px;line-height:1.6;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

.header{
  max-width:560px;margin:0 auto;
  padding:48px 28px 0;
}
.header-top{
  display:flex;align-items:center;gap:8px;
  margin-bottom:4px;
}
.header-top h1{
  font-size:15px;font-weight:600;letter-spacing:-.01em;
}
.header-badge{
  font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink50);background:var(--ink08);
  border-radius:4px;padding:2px 7px;
}
.header p{
  font-size:12px;color:var(--ink50);margin-top:2px;
}

.content{
  max-width:560px;margin:0 auto;
  padding:32px 28px 80px;
}

.section{margin-bottom:28px;}
.section-head{
  display:flex;align-items:center;gap:8px;
  margin-bottom:10px;padding-left:2px;
}
.section-title{
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink50);
}
.status-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
}
.status-dot.live{background:var(--green);}
.status-dot.prep{background:var(--yellow);}

.cards{display:flex;flex-direction:column;gap:8px;}

a.card{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;
  background:var(--white);
  border:1px solid var(--ink15);border-radius:8px;
  text-decoration:none;color:var(--ink);
  transition:border-color .15s,box-shadow .15s;
}
a.card:hover{
  border-color:var(--ink30);
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.card-body{flex:1;min-width:0;}
.card-name{
  font-size:13px;font-weight:500;line-height:1.4;
}
.card-desc{
  font-size:11px;color:var(--ink50);margin-top:2px;line-height:1.5;
}
.card-tag{
  font-size:9px;font-weight:500;letter-spacing:.04em;
  padding:3px 8px;border-radius:4px;flex-shrink:0;
  white-space:nowrap;
}
.tag-live{color:var(--green);background:var(--green-bg);}
.tag-prep{color:var(--yellow);background:var(--yellow-bg);}
.card-arrow{
  color:var(--ink30);font-size:14px;flex-shrink:0;
  transition:color .15s;
}
a.card:hover .card-arrow{color:var(--ink70);}

.archive{
  margin-top:8px;padding-top:20px;
  border-top:1px solid var(--ink08);
}
.archive .section-title{color:var(--ink30);}
.archive a.card{
  background:transparent;border-color:var(--ink08);
  opacity:.6;
}
.archive a.card:hover{opacity:.85;border-color:var(--ink15);background:var(--white);}
.archive .card-tag{color:var(--gray);background:var(--gray-bg);}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>시리아이 · 스킨케어 캠페인</h1>
    <span class="header-badge">Internal</span>
  </div>
  <p>SIRIAI 파트너사 스킨케어 캠페인 링크 관리</p>
</div>

<div class="content">

  <!-- 모집 중 -->
  <div class="section">
    <div class="section-head">
      <span class="status-dot live"></span>
      <span class="section-title">모집 중</span>
    </div>
    <div class="cards">
      <a class="card" href="/forhz-itfu">
        <div class="card-body">
          <div class="card-name">포헤르츠 × 잇퓨 인플루언서 모집</div>
          <div class="card-desc">포헤르츠 버블세럼 · 잇퓨 순율라인 — 2026. 4월 말 – 5월 초</div>
        </div>
        <span class="card-tag tag-live">모집 중</span>
        <span class="card-arrow">→</span>
      </a>
    </div>
  </div>

</div>

</body>
</html>
