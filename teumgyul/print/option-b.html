<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Option B — 럭셔리 센터드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #d6cec6;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 40px 20px 60px;
  font-family: 'Noto Sans KR', sans-serif;
}

.print-btn {
  margin-bottom: 24px;
  padding: 10px 28px;
  background: #2A1A14;
  color: #FFFAF8;
  border: none;
  border-radius: 4px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: .04em;
}

/* A4 */
.page {
  width: 210mm;
  height: 297mm;
  background: #FFFAF8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 14mm 18mm;
}

/* 테두리 라인 */
.frame {
  position: absolute;
  inset: 10mm;
  border: 0.4pt solid rgba(42,26,20,.14);
  pointer-events: none;
}
.page { position: relative; }

/* 상단 브랜드 */
.top-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3.5mm;
  padding-top: 2mm;
}

.collab {
  font-size: 7.5pt;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: rgba(42,26,20,.35);
  font-weight: 400;
}

.rule { width: 28mm; height: 0.3pt; background: rgba(42,26,20,.16); }

/* 중앙 타이틀 */
.main-title {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4mm;
  text-align: center;
}

.title-ko {
  font-family: 'Noto Serif KR', serif;
  font-weight: 300;
  font-size: 48pt;
  color: #2A1A14;
  letter-spacing: .08em;
  line-height: 1;
}

.title-en {
  font-size: 8pt;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: rgba(42,26,20,.4);
  font-weight: 300;
}

.accent-rule {
  width: 6mm;
  height: 1.2pt;
  background: #E8826A;
  border-radius: 1pt;
}

/* QR 영역 */
.qr-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3.5mm;
}

.qr-frame {
  padding: 5mm;
  border: 0.6pt solid rgba(42,26,20,.15);
  display: inline-flex;
  position: relative;
}

/* 코너 장식 */
.qr-frame::before,
.qr-frame::after {
  content: '';
  position: absolute;
  width: 3mm;
  height: 3mm;
}
.qr-frame::before {
  top: -1pt; left: -1pt;
  border-top: 1.2pt solid #E8826A;
  border-left: 1.2pt solid #E8826A;
}
.qr-frame::after {
  bottom: -1pt; right: -1pt;
  border-bottom: 1.2pt solid #E8826A;
  border-right: 1.2pt solid #E8826A;
}

canvas#qr-b { display: block; }

.qr-caption {
  font-size: 6.5pt;
  color: rgba(42,26,20,.3);
  letter-spacing: .2em;
  text-transform: uppercase;
}

/* 하단 */
.bottom-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3mm;
}

.handle {
  font-size: 12pt;
  font-weight: 400;
  color: #2A1A14;
  letter-spacing: .06em;
}

.date-location {
  font-size: 7.5pt;
  color: rgba(42,26,20,.38);
  letter-spacing: .12em;
  text-align: center;
  line-height: 1.9;
}

@media print {
  body { background: none; padding: 0; }
  .print-btn { display: none; }
  .page { box-shadow: none; }
  @page { size: A4; margin: 0; }
}
</style>
</head>
<body>

<button class="print-btn" onclick="window.print()">인쇄하기</button>

<div class="page">
  <div class="frame"></div>

  <div class="top-brand">
    <div class="collab">Iconic Movement &nbsp;×&nbsp; Esther Bunny</div>
    <div class="rule"></div>
  </div>

  <div class="main-title">
    <div class="title-en">Flagship Opening</div>
    <div class="title-ko">틈결</div>
    <div class="accent-rule"></div>
  </div>

  <div class="qr-section">
    <div class="qr-frame">
      <canvas id="qr-b"></canvas>
    </div>
    <div class="qr-caption">입장 체크인</div>
  </div>

  <div class="bottom-info">
    <div class="rule"></div>
    <div class="handle">@teumgyul_official</div>
    <div class="date-location">
      2026. 5. 1 — 5. 3 &nbsp;·&nbsp; 성수, 서울
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script>
QRCode.toCanvas(document.getElementById('qr-b'),
  'https://teumgyul.vercel.app/teumgyul/',
  { width: 104, margin: 2, color: { dark: '#2A1A14', light: '#FFFAF8' } }
);
</script>
</body>
</html>
