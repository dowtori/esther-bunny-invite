<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print B · Ver.2 — 색상 강화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #d6cec6;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 40px 20px 60px;
  font-family: 'Noto Sans KR', sans-serif;
}

.print-btn {
  margin-bottom: 24px;
  padding: 10px 28px;
  background: #2A1A14;
  color: #FFFAF8;
  border: none;
  border-radius: 4px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: .04em;
}

/* A4 */
.page {
  width: 210mm;
  height: 297mm;
  background: #FFFAF8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 14mm 18mm;
}

/* 테두리 라인 */
.frame {
  position: absolute;
  inset: 10mm;
  border: 0.7pt solid #ADA8A5;
  pointer-events: none;
}
.page { position: relative; }

/* 상단 브랜드 */
.top-brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3.5mm;
  padding-top: 2mm;
}

.collab {
  font-size: 7.5pt;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: #5A4840;
  font-weight: 400;
}

.rule { width: 28mm; height: 0.5pt; background: #9A9490; }

/* 중앙 타이틀 */
.main-title {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4mm;
  text-align: center;
}

.title-ko {
  font-family: 'Noto Serif KR', serif;
  font-weight: 300;
  font-size: 48pt;
  color: #2A1A14;
  letter-spacing: .08em;
  line-height: 1;
}

.title-en {
  font-size: 8pt;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: #4E3A34;
  font-weight: 300;
}

.accent-rule {
  width: 6mm;
  height: 1.2pt;
  background: #E8826A;
  border-radius: 1pt;
}

/* QR 영역 */
.qr-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3.5mm;
}

.qr-frame {
  padding: 5mm;
  border: 1pt solid #9A9490;
  display: inline-flex;
  position: relative;
}

/* 코너 장식 */
.qr-frame::before,
.qr-frame::after {
  content: '';
  position: absolute;
  width: 3mm;
  height: 3mm;
}
.qr-frame::before {
  top: -1pt; left: -1pt;
  border-top: 1.2pt solid #E8826A;
  border-left: 1.2pt solid #E8826A;
}
.qr-frame::after {
  bottom: -1pt; right: -1pt;
  border-bottom: 1.2pt solid #E8826A;
  border-right: 1.2pt solid #E8826A;
}

img.qr-img { display: block; width: 44mm; height: 44mm; }

img.keyring-img {
  display: block;
  width: 38mm;
  height: auto;
}

.qr-caption {
  font-size: 6.5pt;
  color: #5A4840;
  letter-spacing: .2em;
  text-transform: uppercase;
}

/* 하단 */
.bottom-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3mm;
}

.handle {
  font-size: 18pt;
  font-weight: 400;
  color: #2A1A14;
  letter-spacing: .04em;
}

.handle-label {
  font-size: 7pt;
  color: #5A4840;
  letter-spacing: .2em;
  text-transform: uppercase;
}

.date-location {
  font-size: 7.5pt;
  color: #4E3A34;
  letter-spacing: .12em;
  text-align: center;
  line-height: 1.9;
}

@media print {
  body { background: none; padding: 0; }
  .print-btn { display: none; }
  .page { box-shadow: none; }
  @page { size: A4; margin: 0; }
}
</style>
</head>
