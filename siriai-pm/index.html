<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SIRIAI · PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <!-- ── LEFT: 거래처 패널 (220px) ─────────────────────── -->
  <aside class="client-panel" id="clientPanel"></aside>

  <!-- ── CENTER: 캠페인 목록 패널 (flex) ──────────────── -->
  <div class="campaign-panel" id="campaignPanel"></div>

  <!-- ── RIGHT: 캠페인 상세 패널 (380px) ──────────────── -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-empty">캠페인을 선택하세요</div>
  </div>

</div>

<!-- ── STATUS DROPDOWN (global, fixed) ─── -->
<div id="statusDropdown" class="status-dropdown" style="position:fixed"></div>

<!-- ── MODAL ──────────────────────────────────────── -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="if(event.target===this)Modal.hide()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="Modal.hide()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- ── TOAST ────────────────────────────────────────── -->
<div class="toast-container" id="toastContainer"></div>

<!-- ── SCRIPTS ──────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>

</body>
</html>
