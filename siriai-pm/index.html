<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SIRIAI · PM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <!-- ── SIDEBAR ─────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-text">SIRIAI</div>
      <div class="sidebar-logo-sub">Project Manager</div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section"><div class="nav-section-label">메뉴</div></div>

      <div class="nav-item active" data-view="dashboard" onclick="App.navigate('dashboard')">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5v-3zm8 0A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5v-3zm-8 8A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5v-3zm8 0A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5v-3z"/>
        </svg>
        <span>대시보드</span>
        <span class="nav-badge" id="dashBadge" style="display:none">0</span>
      </div>

      <div class="nav-item" data-view="campaigns" onclick="App.navigate('campaigns')">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2zm15 0a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2zM4 4h8a.5.5 0 0 1 0 1H4a.5.5 0 0 1 0-1zm0 3h8a.5.5 0 0 1 0 1H4a.5.5 0 0 1 0-1zm0 3h5a.5.5 0 0 1 0 1H4a.5.5 0 0 1 0-1z"/>
        </svg>
        <span>캠페인</span>
      </div>

      <div class="nav-item" data-view="qa" onclick="App.navigate('qa')">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path d="M14.5 3a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-13a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h13zm-13-1A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-13z"/>
          <path d="M7 5.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5zm-1.496-.854a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0l-.5-.5a.5.5 0 1 1 .708-.708l.146.147 1.146-1.147a.5.5 0 0 1 .708 0zM7 9.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1-.5-.5zm-1.496-.854a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0l-.5-.5a.5.5 0 0 1 .708-.708l.146.147 1.146-1.147a.5.5 0 0 1 .708 0z"/>
        </svg>
        <span>QA 검수</span>
      </div>

      <div class="nav-item" data-view="finance" onclick="App.navigate('finance')">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path d="M1 3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1H1zm7 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
          <path d="M0 5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V5zm3 0a2 2 0 0 1-2 2v4a2 2 0 0 1 2 2h10a2 2 0 0 1 2-2V7a2 2 0 0 1-2-2H3z"/>
        </svg>
        <span>정산</span>
      </div>
    </nav>
  </aside>

  <!-- ── MAIN ────────────────────────────────────────────── -->
  <div class="main-area">

    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-title" id="topbarTitle">SIRIAI PM</div>
      <div class="topbar-right">
        <span class="topbar-date" id="topDate"></span>
        <div class="notif-wrap" id="notifWrap" style="position:relative">
          <button class="notif-btn" onclick="Notif.toggle()" title="알림">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zM8 1.918l-.797.161A4.002 4.002 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4.002 4.002 0 0 0-3.203-3.92L8 1.917zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5.002 5.002 0 0 1 13 6c0 .88.32 4.2 1.22 6z"/>
            </svg>
            <span class="notif-count" id="notifCount" style="display:none">0</span>
          </button>
          <div class="notif-dropdown" id="notifDropdown">
            <div class="notif-header">알림</div>
            <div id="notifBody"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Page content -->
    <div class="page" id="mainContent">
      <div class="empty-state">로딩 중…</div>
    </div>

  </div><!-- /main-area -->

</div><!-- /app-shell -->

<!-- ── STATUS DROPDOWN (global, positioned absolutely) ─── -->
<div id="statusDropdown" class="status-dropdown" style="position:fixed"></div>

<!-- ── DRAWER ──────────────────────────────────────────── -->
<div class="drawer-overlay" id="drawerOverlay" onclick="Drawer.close()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-title" id="drawerTitle"></div>
    <button class="drawer-close" onclick="Drawer.close()">×</button>
  </div>
  <div id="drawerTabs"></div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-footer" id="drawerFooter"></div>
</div>

<!-- ── MODAL ───────────────────────────────────────────── -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="if(event.target===this)Modal.hide()">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" onclick="Modal.hide()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- ── TOAST ────────────────────────────────────────────── -->
<div class="toast-container" id="toastContainer"></div>

<!-- ── SCRIPTS ──────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>

</body>
</html>
